apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-ranking-deployment
  labels:
    app: chess-ranking
    version: v1
spec:
  # Run 2 replicas for high availability
  replicas: 2

  selector:
    matchLabels:
      app: chess-ranking

  template:
    metadata:
      labels:
        app: chess-ranking
        version: v1

    spec:
      containers:
      - name: chess-ranking-container
        image: chess-ranking:latest

        # Never pull from registry, use local image
        imagePullPolicy: Never

        ports:
        - containerPort: 5000
          name: http
          protocol: TCP

        # Environment variables
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"

        # Resource limits
        # Prevents container from using too much CPU/memory
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        # Liveness probe
        # Kubernetes will restart container if this fails
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        # Container won't receive traffic until this passes
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
