apiVersion: v1
kind: Service
metadata:
  name: chess-ranking-service
  labels:
    app: chess-ranking
spec:
  # NodePort allows external access
  # Good for development/testing with Minikube
  type: NodePort

  selector:
    app: chess-ranking

  ports:
  - name: http
    protocol: TCP
    port: 5000          # Service port (internal)
    targetPort: 5000    # Container port
    nodePort: 30080     # External access port (30000-32767 range)

  # Session affinity ensures same client goes to same pod
  # Important for applications with session state
  sessionAffinity: ClientIP
